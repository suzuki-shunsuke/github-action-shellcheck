---
name: test-actions
on: pull_request
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - uses: actions/checkout@v3.3.0
        with:
          persist-credentials: false
      - uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
      - uses: ./
      - uses: ./
        with:
          working_directory: tests
